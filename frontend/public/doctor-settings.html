<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paramètres du médecin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="doctor-page view-settings">
  <div class="doc-layout">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo-badge sm" data-icon="cross" data-size="18"></span>
        <div><strong data-i18n="sidebarBrandLine1"></strong><small data-i18n="sidebarBrandLine2"></small></div>
      </div>

      <div class="lang-switch inline sidebar-lang">
        <button class="lang-btn" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="ar">عربي</button>
      </div>

      <div class="doc-profile">
        <div class="avatar" id="docAvatar"></div>
        <strong id="docName"></strong>
        <small id="docSpecialty"></small>
      </div>

      <nav class="side-nav">
        <a href="doctor-dashboard.html" class="nav-item"><span data-icon="layout" data-size="18"></span><span data-i18n="navDashboard"></span></a>
        <a href="doctor-appointments.html" class="nav-item"><span data-icon="calendar" data-size="18"></span><span data-i18n="navMyAppointments"></span></a>
        <a href="doctor-patients.html" class="nav-item"><span data-icon="users" data-size="18"></span><span data-i18n="navMyPatients"></span></a>
        <a href="doctor-notifications.html" class="nav-item"><span data-icon="bell" data-size="18"></span><span data-i18n="navNotifications"></span></a>
        <a href="doctor-settings.html" class="nav-item active"><span data-icon="settings" data-size="18"></span><span data-i18n="navSettings"></span></a>
      </nav>

      <button id="docLogout" class="side-logout"><span data-icon="logout" data-size="18"></span><span data-i18n="logout"></span></button>
    </aside>

    <main class="doc-main" id="top">
      <header class="doc-header">
        <div>
          <h1 data-i18n="doctorSettingsTitle"></h1>
          <p id="docGreeting"></p>
        </div>
        <div class="header-right">
          <div class="notif-wrap">
            <button id="notifBellBtn" class="bell-btn" aria-label="Notifications">
              <span data-icon="bell" data-size="18"></span>
              <span id="notifBadge" class="notif-badge" hidden></span>
            </button>
            <div id="notifDropdown" class="notif-dropdown">
              <div class="notif-dropdown-head">
                <strong data-i18n="notifBellLabel"></strong>
                <button class="notif-markall" data-notif-mark-all data-i18n="notifMarkAllRead"></button>
              </div>
              <div id="notifDropdownList" class="notif-dropdown-list"></div>
              <a href="doctor-notifications.html" class="notif-seeall" data-i18n="notifSeeAll"></a>
            </div>
          </div>
          <div class="date-chip"><span data-icon="calendar" data-size="16"></span><span id="todayDate"></span></div>
        </div>
      </header>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-icon" data-icon="calendar" data-size="22"></div>
          <div><strong id="statToday">0</strong><span class="label" data-i18n="statTodayLabel"></span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange" data-icon="clock" data-size="22"></div>
          <div><strong id="statPending">0</strong><span class="label" data-i18n="statPendingLabel"></span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green" data-icon="users" data-size="22"></div>
          <div><strong id="statPatients">0</strong><span class="label" data-i18n="statPatientsLabel"></span></div>
        </div>
      </section>

      <section class="panel" id="todaySection">
        <div class="panel-head">
          <h2 class="section-title"><span class="icon-badge" data-icon="calendar" data-size="16"></span><span data-i18n="appointmentsPanelTitle"></span></h2>
          <div class="pills-row" id="apptFilter">
            <button class="pill active" data-filter="today" data-i18n="filterToday"></button>
            <button class="pill" data-filter="upcoming" data-i18n="filterUpcoming"></button>
            <button class="pill" data-filter="all" data-i18n="filterAll"></button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="appt-table">
            <thead>
              <tr>
                <th data-i18n="colPatient"></th>
                <th data-i18n="colTime"></th>
                <th data-i18n="colStatus"></th>
                <th data-i18n="colActions"></th>
              </tr>
            </thead>
            <tbody id="apptBody"></tbody>
          </table>
        </div>
      </section>

      <h2 class="section-title" id="patientsSection"><span class="icon-badge" data-icon="users" data-size="16"></span><span data-i18n="patientsSectionTitle"></span></h2>
      <div id="patientsGrid" class="grid"></div>
    
      <section class="panel doctor-settings-panel">
        <div class="panel-head">
          <h2 class="section-title" data-i18n="doctorSettingsTitle"></h2>
        </div>
        <form id="doctorSettingsForm" class="doctor-settings-form">

          <label for="doctorPhone" data-i18n="settingsPhoneLabel"></label>
          <input id="doctorPhone" name="phone" type="tel" maxlength="30">

          <label for="availableFrom" data-i18n="settingsAvailableFromLabel"></label>
          <input id="availableFrom" name="availableFrom" type="time" required>

          <label for="availableTo" data-i18n="settingsAvailableToLabel"></label>
          <input id="availableTo" name="availableTo" type="time" required>

          <button class="pill active" type="submit"
                  data-i18n="settingsSaveButton"></button>

          <p id="settingsMessage" class="settings-message"
             role="status"></p>
        </form>
      </section>
</main>

  </div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/doctor-dashboard.js"></script>
<script src="js/doctor-settings.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
